<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pass Scanner | TBFF 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #0a0612 0%, #1a0a2e 40%, #2d1b4e 70%, #0f0520 100%);
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }

    /* Animated background elements */
    .bg-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
      pointer-events: none;
      animation: pulse 8s ease-in-out infinite;
    }
    
    .glow-1 {
      top: -100px;
      right: -100px;
      background: #D4AF37;
    }
    
    .glow-2 {
      bottom: -100px;
      left: -100px;
      background: #7c3aed;
      animation-delay: -4s;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.15; }
      50% { transform: scale(1.2); opacity: 0.2; }
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      text-align: center;
      padding: 25px 0 30px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 15px;
      transition: color 0.3s;
    }

    .back-link:hover { color: #D4AF37; }

    .festival-dates {
      color: #CD7F32;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .etwot-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.5);
      margin-top: 12px;
      font-weight: 500;
    }

    .etwot-badge img {
      height: 18px;
      opacity: 0.6;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #D4AF37 0%, #f4e4a6 50%, #CD7F32 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: rgba(255,255,255,0.5);
      margin-top: 8px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 25px;
      padding: 15px;
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: #D4AF37;
      font-family: 'Playfair Display', serif;
    }

    .stat-label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* Scanner Section */
    .scanner-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .scanner-section {
      background: linear-gradient(145deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
      border-radius: 24px;
      padding: 15px;
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }

    .scanner-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #D4AF37, #ff6b35, #D4AF37);
      background-size: 200% 100%;
      animation: shimmer 3s linear infinite;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    #reader {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      min-height: 280px;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scanner-placeholder {
      text-align: center;
      padding: 60px 20px;
    }

    .scanner-placeholder-icon {
      font-size: 4rem;
      margin-bottom: 15px;
      opacity: 0.3;
    }

    .scanner-placeholder-text {
      color: rgba(255,255,255,0.4);
      font-size: 0.95rem;
    }

    /* Corner decorations */
    .corner-decoration {
      position: absolute;
      width: 30px;
      height: 30px;
      border: 3px solid #D4AF37;
      pointer-events: none;
      opacity: 0.6;
    }

    .corner-tl { top: 25px; left: 25px; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
    .corner-tr { top: 25px; right: 25px; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
    .corner-bl { bottom: 25px; left: 25px; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
    .corner-br { bottom: 25px; right: 25px; border-left: none; border-top: none; border-radius: 0 0 8px 0; }

    /* Buttons */
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      padding: 16px 20px;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #D4AF37 0%, #CD7F32 100%);
      color: #1a0a2e;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
      grid-column: span 2;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.4);
    }

    .btn-stop {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      grid-column: span 2;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3);
    }

    .btn-stop:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(239, 68, 68, 0.4);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.25);
      transform: translateY(-2px);
    }

    .btn-icon {
      font-size: 1.2rem;
    }

    /* Result Card */
    .result-card {
      display: none;
      border-radius: 24px;
      padding: 0;
      margin-bottom: 25px;
      border: 2px solid;
      overflow: hidden;
      animation: resultPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes resultPop {
      0% { opacity: 0; transform: scale(0.9) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .result-valid { border-color: #4ade80; }
    .result-invalid { border-color: #ef4444; }

    .result-header {
      padding: 25px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .result-valid .result-header {
      background: linear-gradient(135deg, rgba(74, 222, 128, 0.15) 0%, rgba(74, 222, 128, 0.05) 100%);
    }

    .result-invalid .result-header {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15) 0%, rgba(239, 68, 68, 0.05) 100%);
    }

    .result-icon {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      flex-shrink: 0;
    }

    .result-valid .result-icon {
      background: rgba(74, 222, 128, 0.2);
      box-shadow: 0 0 30px rgba(74, 222, 128, 0.3);
    }

    .result-invalid .result-icon {
      background: rgba(239, 68, 68, 0.2);
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.3);
    }

    .result-status {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
    }

    .result-valid .result-status { color: #4ade80; }
    .result-invalid .result-status { color: #ef4444; }

    .result-message {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .pass-details {
      background: rgba(0,0,0,0.2);
      padding: 20px 25px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .detail-row:last-child { border-bottom: none; }

    .detail-label {
      color: rgba(255,255,255,0.45);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .detail-value {
      font-weight: 600;
      text-align: right;
      max-width: 60%;
    }

    .film-type-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-competition {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(212, 175, 55, 0.1));
      color: #D4AF37;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .badge-showcase {
      background: linear-gradient(135deg, rgba(255, 107, 53, 0.25), rgba(255, 107, 53, 0.1));
      color: #ff6b35;
      border: 1px solid rgba(255, 107, 53, 0.3);
    }

    .badge-visitor {
      background: linear-gradient(135deg, rgba(96, 165, 250, 0.25), rgba(96, 165, 250, 0.1));
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.3);
    }

    /* Scan History */
    .scan-history {
      background: rgba(255,255,255,0.03);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .history-title {
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .history-title-icon {
      font-size: 1.2rem;
    }

    .history-count {
      background: linear-gradient(135deg, #D4AF37, #CD7F32);
      color: #1a0a2e;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .history-list {
      max-height: 320px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .history-list::-webkit-scrollbar {
      width: 4px;
    }

    .history-list::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.3);
      border-radius: 4px;
    }

    .history-item {
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border-left: 4px solid #4ade80;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item:hover {
      background: rgba(255,255,255,0.06);
      transform: translateX(4px);
    }

    .history-item-info {
      flex: 1;
    }

    .history-item-name {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .history-item-film {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
    }

    .history-item-meta {
      text-align: right;
    }

    .history-item-time {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.4);
      font-weight: 500;
    }

    .history-item-badge {
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 10px;
      margin-top: 5px;
      display: inline-block;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: rgba(255,255,255,0.3);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 15px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 0.95rem;
    }

    /* Sound toggle */
    .sound-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.1);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s;
      z-index: 100;
    }

    .sound-toggle:hover {
      background: rgba(255,255,255,0.2);
    }

    #qrCodeUpload {
      display: none;
    }

    /* Responsive */
    @media (max-width: 500px) {
      .container { padding: 15px; }
      header { padding: 20px 0 25px; }
      .back-link { font-size: 0.8rem; margin-bottom: 12px; }
      .logo { font-size: 1.4rem; }
      .festival-dates { font-size: 0.8rem; }
      .subtitle { font-size: 0.8rem; margin-top: 6px; }
      .etwot-badge { font-size: 0.65rem; margin-top: 10px; }
      .stats-bar { gap: 15px; padding: 12px 10px; margin-bottom: 20px; border-radius: 14px; }
      .stat-value { font-size: 1.5rem; }
      .stat-label { font-size: 0.6rem; }
      .scanner-section { padding: 12px; border-radius: 18px; }
      #reader { min-height: 250px; border-radius: 14px; }
      .corner-decoration { width: 25px; height: 25px; }
      .corner-tl, .corner-bl { left: 20px; }
      .corner-tr, .corner-br { right: 20px; }
      .corner-tl, .corner-tr { top: 20px; }
      .corner-bl, .corner-br { bottom: 20px; }
      .btn-group { grid-template-columns: 1fr 1fr; gap: 10px; }
      .btn-primary, .btn-stop { grid-column: span 2; }
      .btn { padding: 14px 16px; font-size: 0.9rem; border-radius: 12px; }
      .btn-icon { font-size: 1.1rem; }
      .result-card { border-radius: 18px; margin-bottom: 20px; }
      .result-header { padding: 20px; gap: 14px; }
      .result-icon { width: 55px; height: 55px; font-size: 2rem; }
      .result-status { font-size: 1.4rem; }
      .result-message { font-size: 0.85rem; }
      .pass-details { padding: 16px 18px; }
      .detail-row { padding: 10px 0; }
      .detail-label { font-size: 0.8rem; }
      .detail-value { font-size: 0.9rem; }
      .scan-history { padding: 16px; border-radius: 16px; }
      .history-header { margin-bottom: 14px; padding-bottom: 12px; }
      .history-title { font-size: 0.9rem; }
      .history-count { padding: 5px 12px; font-size: 0.8rem; }
      .history-item { padding: 12px 14px; border-radius: 10px; }
      .history-item-name { font-size: 0.9rem; }
      .history-item-film { font-size: 0.75rem; }
      .history-item-time { font-size: 0.7rem; }
      .history-item-badge { font-size: 0.6rem; padding: 2px 6px; }
      .sound-toggle { top: 15px; right: 15px; width: 38px; height: 38px; font-size: 1rem; }
    }

    @media (max-width: 380px) {
      .stats-bar { flex-wrap: wrap; justify-content: space-around; }
      .stat-item { min-width: 70px; }
      .btn-group { grid-template-columns: 1fr; }
      .btn-primary, .btn-stop { grid-column: span 1; }
      .history-item { flex-direction: column; align-items: flex-start; gap: 8px; }
      .history-item-meta { text-align: left; display: flex; align-items: center; gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  
  <button class="sound-toggle" onclick="toggleSound()" title="Toggle sound">
    🔊
  </button>

  <div class="container">
    <header>
      <a href="index.html" class="back-link">← Back to Home</a>
      <div class="logo">The Bhopal Film Festival</div>
      <div class="festival-dates">21 - 22 February 2026</div>
      <div class="etwot-badge">
        <img src="etwot-logo.avif" alt="etwot" onerror="this.style.display='none'">
        Built by <strong>ETWOT</strong>
      </div>
      <div class="subtitle">
        <span class="live-dot"></span>
        E-Pass Verification Scanner
      </div>
    </header>

    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-value" id="scanCount">0</div>
        <div class="stat-label">Scanned Today</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="competitionCount">0</div>
        <div class="stat-label">Competition</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="showcaseCount">0</div>
        <div class="stat-label">Showcase</div>
      </div>
    </div>

    <div class="scanner-wrapper">
      <div class="scanner-section">
        <div class="corner-decoration corner-tl"></div>
        <div class="corner-decoration corner-tr"></div>
        <div class="corner-decoration corner-bl"></div>
        <div class="corner-decoration corner-br"></div>
        <div id="reader">
          <div class="scanner-placeholder" id="placeholder">
            <div class="scanner-placeholder-icon">📷</div>
            <div class="scanner-placeholder-text">Click "Start Scanner" to begin</div>
          </div>
        </div>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" id="startBtn" onclick="startScanner()">
        <span class="btn-icon">📷</span> Start Scanner
      </button>
      
      <button class="btn btn-stop" id="stopBtn" onclick="stopScanner()" style="display: none;">
        <span class="btn-icon">⏹️</span> Stop Scanner
      </button>

      <label class="btn btn-secondary" for="qrCodeUpload">
        <span class="btn-icon">📁</span> Upload Image
      </label>
      <button class="btn btn-secondary" onclick="clearHistory()">
        <span class="btn-icon">🗑️</span> Clear History
      </button>
    </div>

    <input type="file" id="qrCodeUpload" accept="image/*" onchange="handleFileUpload(event)">

    <div id="result" class="result-card">
      <div class="result-header">
        <div class="result-icon" id="resultIcon">✓</div>
        <div>
          <div class="result-status" id="resultStatus">Valid Pass</div>
          <div class="result-message" id="resultMessage"></div>
        </div>
      </div>
      <div class="pass-details" id="passDetails"></div>
    </div>

    <div class="scan-history">
      <div class="history-header">
        <span class="history-title">
          <span class="history-title-icon">📋</span>
          Today's Entries
        </span>
        <span class="history-count" id="historyCount">0</span>
      </div>
      <div class="history-list" id="historyList">
        <div class="empty-state">
          <div class="empty-state-icon">🎬</div>
          <div class="empty-state-text">No passes scanned yet<br>Start scanning to track entries</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Success sound -->
  <audio id="successSound" preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdH2JkI2LgoF8eHd4e4CDhoWFgoB+fHp6e3x+gIGCgoGAf359fHx8fX5/gIGBgYB/fn18fHx9fn+AgYGBgH9+fXx8fH1+f4CBgYGAf359fHx8fX5/gIGBgYB/fn18fHx9fn+AgYGBgH9+fXx8fH1+f4CBgYGAf359fHx8fX5/gA==" type="audio/wav">
  </audio>
  <audio id="errorSound" preload="auto">
    <source src="data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
  </audio>

  <script>
    let html5QrCode = null;
    let scanHistory = JSON.parse(localStorage.getItem('tbff_scan_history') || '[]');
    let soundEnabled = true;
    
    // Filter to today's scans only
    const today = new Date().toDateString();
    scanHistory = scanHistory.filter(s => new Date(s.time).toDateString() === today);
    updateHistoryUI();
    updateStats();

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.querySelector('.sound-toggle').textContent = soundEnabled ? '🔊' : '🔇';
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        if (type === 'success') {
          // Create a pleasant beep
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();
          oscillator.connect(gain);
          gain.connect(ctx.destination);
          oscillator.frequency.value = 880;
          oscillator.type = 'sine';
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          oscillator.start(ctx.currentTime);
          oscillator.stop(ctx.currentTime + 0.3);
        } else {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();
          oscillator.connect(gain);
          gain.connect(ctx.destination);
          oscillator.frequency.value = 200;
          oscillator.type = 'square';
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          oscillator.start(ctx.currentTime);
          oscillator.stop(ctx.currentTime + 0.5);
        }
      } catch(e) {}
    }

    function startScanner() {
      document.getElementById('placeholder').style.display = 'none';
      
      html5QrCode = new Html5Qrcode("reader");
      
      // Get camera and then start with optimal settings
      Html5Qrcode.getCameras().then(cameras => {
        if (cameras && cameras.length) {
          // Prefer back camera
          let cameraId = cameras[0].id;
          for (let cam of cameras) {
            if (cam.label.toLowerCase().includes('back') || cam.label.toLowerCase().includes('rear')) {
              cameraId = cam.id;
              break;
            }
          }
          
          const config = {
            fps: 20,
            qrbox: function(viewfinderWidth, viewfinderHeight) {
              // Make scan box 70% of the viewfinder
              let minEdge = Math.min(viewfinderWidth, viewfinderHeight);
              let qrboxSize = Math.floor(minEdge * 0.7);
              return { width: qrboxSize, height: qrboxSize };
            },
            aspectRatio: 1.0,
            disableFlip: false,
            experimentalFeatures: {
              useBarCodeDetectorIfSupported: true
            }
          };

          html5QrCode.start(
            cameraId,
            config,
            onScanSuccess,
            onScanError
          ).then(() => {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'flex';
            console.log('✅ Camera started successfully');
          }).catch(err => {
            console.error('Camera start error:', err);
            alert('Could not start camera: ' + err);
            document.getElementById('placeholder').style.display = 'block';
          });
        } else {
          alert('No cameras found on this device');
          document.getElementById('placeholder').style.display = 'block';
        }
      }).catch(err => {
        console.error('Camera enumeration error:', err);
        // Fallback to facingMode
        const config = {
          fps: 20,
          qrbox: { width: 280, height: 280 },
          aspectRatio: 1.0
        };
        
        html5QrCode.start(
          { facingMode: "environment" },
          config,
          onScanSuccess,
          onScanError
        ).then(() => {
          document.getElementById('startBtn').style.display = 'none';
          document.getElementById('stopBtn').style.display = 'flex';
        }).catch(err2 => {
          alert('Could not start camera: ' + err2);
          document.getElementById('placeholder').style.display = 'block';
        });
      });
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          document.getElementById('startBtn').style.display = 'flex';
          document.getElementById('stopBtn').style.display = 'none';
          document.getElementById('reader').innerHTML = `
            <div class="scanner-placeholder" id="placeholder">
              <div class="scanner-placeholder-icon">📷</div>
              <div class="scanner-placeholder-text">Scanner stopped</div>
            </div>
          `;
        });
      }
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const tempScanner = new Html5Qrcode("reader");
      tempScanner.scanFile(file, true)
        .then(decodedText => {
          processQRData(decodedText);
        })
        .catch(err => {
          showInvalidResult('Could not read QR code from image');
        });
      
      // Reset input
      event.target.value = '';
    }

    function onScanSuccess(decodedText) {
      if (navigator.vibrate) {
        navigator.vibrate(200);
      }
      processQRData(decodedText);
    }

    function onScanError(error) {
      // Ignore scan errors
    }

    function processQRData(data) {
      console.log('📷 Scanned QR Data:', data);
      
      try {
        const rawData = JSON.parse(data);
        console.log('✅ Parsed JSON:', rawData);
        
        // Handle both old format (passId, name, etc.) and new compact format (id, n, d, f, t)
        let pass;
        if (rawData.id && rawData.id.startsWith('TBFF-')) {
          // New compact format
          console.log('📋 Detected: New compact format');
          pass = {
            passId: rawData.id,
            name: rawData.n,
            designation: rawData.d,
            filmTitle: rawData.f,
            filmType: rawData.t,
            phone: rawData.p,
            email: rawData.e
          };
        } else if (rawData.passId && rawData.passId.startsWith('TBFF-')) {
          // Old format - use as is
          console.log('📋 Detected: Old format');
          pass = rawData;
        } else {
          console.log('❌ Invalid: No valid passId found', rawData);
          playSound('error');
          showInvalidResult('Not a valid TBFF pass');
          return;
        }

        console.log('✅ Final pass object:', pass);
        const alreadyScanned = scanHistory.find(s => s.passId === pass.passId);
        
        playSound('success');
        showValidResult(pass, alreadyScanned);
        
        if (!alreadyScanned) {
          addToHistory(pass);
        }
      } catch (e) {
        console.error('❌ QR Parse Error:', e);
        console.error('Raw data was:', data);
        playSound('error');
        showInvalidResult('Invalid QR code format');
      }
    }

    function showValidResult(pass, alreadyScanned) {
      const result = document.getElementById('result');
      const icon = document.getElementById('resultIcon');
      const status = document.getElementById('resultStatus');
      const message = document.getElementById('resultMessage');
      const details = document.getElementById('passDetails');

      result.className = 'result-card result-valid';
      result.style.display = 'block';
      icon.textContent = '✓';
      status.textContent = 'Valid Pass';
      message.textContent = alreadyScanned 
        ? '⚠️ Already scanned at ' + new Date(alreadyScanned.time).toLocaleTimeString() 
        : '✅ Entry permitted';

      const isVisitor = pass.filmType === 'visitor';
      let badgeClass = 'badge-competition';
      if (pass.filmType === 'showcase') badgeClass = 'badge-showcase';
      if (pass.filmType === 'visitor') badgeClass = 'badge-visitor';
      
      details.innerHTML = `
        <div class="detail-row">
          <span class="detail-label">Name</span>
          <span class="detail-value">${pass.name}</span>
        </div>
        ${!isVisitor ? `<div class="detail-row">
          <span class="detail-label">Designation</span>
          <span class="detail-value">${pass.designation}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Film</span>
          <span class="detail-value">${pass.filmTitle}</span>
        </div>` : ''}
        <div class="detail-row">
          <span class="detail-label">Category</span>
          <span class="detail-value">
            <span class="film-type-badge ${badgeClass}">${pass.filmType.toUpperCase()}</span>
          </span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Pass ID</span>
          <span class="detail-value" style="font-family: monospace; font-size: 0.75rem; opacity: 0.7;">${pass.passId}</span>
        </div>
        ${pass.phone ? `<div class="detail-row">
          <span class="detail-label">Phone</span>
          <span class="detail-value">${pass.phone}</span>
        </div>` : ''}
      `;

      result.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function showInvalidResult(errorMessage) {
      const result = document.getElementById('result');
      const icon = document.getElementById('resultIcon');
      const status = document.getElementById('resultStatus');
      const message = document.getElementById('resultMessage');
      const details = document.getElementById('passDetails');

      result.className = 'result-card result-invalid';
      result.style.display = 'block';
      icon.textContent = '✕';
      status.textContent = 'Invalid Pass';
      message.textContent = errorMessage;
      details.innerHTML = `
        <div style="text-align: center; padding: 30px; color: rgba(255,255,255,0.4);">
          <div style="font-size: 2rem; margin-bottom: 10px;">🚫</div>
          <div>Entry Denied</div>
        </div>
      `;

      result.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function addToHistory(pass) {
      const entry = {
        passId: pass.passId,
        name: pass.name,
        filmTitle: pass.filmTitle,
        filmType: pass.filmType,
        time: new Date().toISOString()
      };
      
      scanHistory.unshift(entry);
      localStorage.setItem('tbff_scan_history', JSON.stringify(scanHistory));
      updateHistoryUI();
      updateStats();
    }

    function updateStats() {
      document.getElementById('scanCount').textContent = scanHistory.length;
      document.getElementById('historyCount').textContent = scanHistory.length;
      
      const competition = scanHistory.filter(s => s.filmType === 'competition').length;
      const showcase = scanHistory.filter(s => s.filmType === 'showcase').length;
      
      document.getElementById('competitionCount').textContent = competition;
      document.getElementById('showcaseCount').textContent = showcase;
    }

    function updateHistoryUI() {
      const list = document.getElementById('historyList');
      
      if (scanHistory.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🎬</div>
            <div class="empty-state-text">No passes scanned yet<br>Start scanning to track entries</div>
          </div>
        `;
        return;
      }

      list.innerHTML = scanHistory.map(entry => {
        const badgeClass = entry.filmType === 'competition' ? 'badge-competition' : 'badge-showcase';
        return `
          <div class="history-item">
            <div class="history-item-info">
              <div class="history-item-name">${entry.name}</div>
              <div class="history-item-film">${entry.filmTitle}</div>
            </div>
            <div class="history-item-meta">
              <div class="history-item-time">${new Date(entry.time).toLocaleTimeString()}</div>
              <span class="history-item-badge ${badgeClass}">${entry.filmType}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function clearHistory() {
      if (confirm('Clear all scan history for today?')) {
        scanHistory = [];
        localStorage.setItem('tbff_scan_history', JSON.stringify(scanHistory));
        updateHistoryUI();
        updateStats();
        document.getElementById('result').style.display = 'none';
      }
    }
  </script>
</body>
